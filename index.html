<style>
:root{--bg:#0a2342;--bg2:#0e2f58;--card:rgba(13,46,90,.82);--line:#eaf4ff;--blue:#8fc7ff;--dim:#6f9fd6;--acc:#ff9a1f;--ok:#46e09a;--bad:#ff5d6c;--r:14px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--line);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background-color:var(--bg);background-image:linear-gradient(rgba(143,199,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(143,199,255,.12) 1px,transparent 1px),linear-gradient(rgba(143,199,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(143,199,255,.05) 1px,transparent 1px);background-size:50px 50px,50px 50px,10px 10px,10px 10px;background-attachment:fixed;min-height:100vh;overflow-x:hidden}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:rgba(8,28,54,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(143,199,255,.25)}
header.top h1{font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
header.top h1 span{color:var(--acc)}
.iconbtn{background:none;border:1px solid rgba(143,199,255,.35);color:var(--line);border-radius:10px;min-width:40px;height:40px;font-size:18px;display:grid;place-items:center;cursor:pointer;padding:0 8px}
main{max-width:680px;margin:0 auto;padding:14px 14px calc(96px + var(--safe-b))}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(8,28,54,.96);border-top:1px solid rgba(143,199,255,.25);padding-bottom:var(--safe-b)}
nav.bot a{flex:1;text-align:center;color:var(--blue);text-decoration:none;font-size:11.5px;padding:7px 0 8px;letter-spacing:.04em}
nav.bot a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
nav.bot a.on{color:var(--acc)}
h2{font-size:21px;margin:18px 0 8px;letter-spacing:.02em}
h3{font-size:17px;margin:20px 0 8px;color:var(--blue);display:flex;align-items:center;gap:8px}
h3 .no{color:var(--acc);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
p{margin:8px 0}

 <p>Zwróć uwagę na rzut C: stopień jest z tyłu (od strony prawej bryły), więc z lewej go nie widać – jego krawędź rysujemy <b>linią kreskową</b>. W rzucie C przód przedmiotu jest po prawej stronie.</p>
 <h3><span class="no">03</span>Zasady</h3>
 <ul class="clean"><li>Rzut główny wybieramy tak, by pokazywał <b>najwięcej informacji</b> o kształcie, najlepiej w położeniu pracy lub montażu.</li><li>Rysujemy tylko tyle rzutów, ile potrzeba, by kształt był jednoznaczny.</li><li>Metodę oznacza symbol w tabliczce:</li></ul>
 ${fig(svg('-15 -12 120 66',symE(0,0,1)),'Symbol metody E – wąski koniec stożka skierowany od okręgów')}
 <div class="tip">W Holandii i całej Europie stosuje się metodę <b>E</b>. W USA – metodę <b>A</b> (III kąt), gdzie rzut z góry jest <i>nad</i> rzutem głównym. Zawsze sprawdzaj symbol!</div>`,
 tryT:'Obracaj i oglądaj rzuty',tryKind:'views3',
 quiz:[
  {q:'W metodzie E rzut z góry umieszcza się…',o:['nad rzutem głównym','pod rzutem głównym','na lewo od rzutu głównego','dowolnie'],a:1,e:'W metodzie europejskiej E widok z góry leży pod rzutem głównym.'},
  {q:'Gdzie w metodzie E leży rzut z lewej strony?',o:['Po lewej stronie rzutu głównego','Po prawej stronie rzutu głównego','Pod rzutem z góry','Nad rzutem głównym'],a:1,e:'Widok z lewej umieszczamy po prawej stronie – „odwrotnie”, bo przedmiot jest między obserwatorem a rzutnią.'},
  {q:'Jak wybrać rzut główny?',o:['Zawsze od najmniejszej ściany','Tak, by pokazywał najwięcej informacji o kształcie','Zawsze od spodu','Losowo'],a:1,e:'Rzut główny ma być najbardziej informacyjny, najlepiej w położeniu pracy przedmiotu.'},
  {q:'Który wymiar jest wspólny dla rzutu głównego i rzutu z góry?',o:['Wysokość','Głębokość','Szerokość','Żaden'],a:2,e:'Rzut z góry leży pod głównym – oba pokazują tę samą szerokość.'},
  {q:'Metoda E to inaczej…',o:['rzutowanie w I kącie (europejskie)','rzutowanie w III kącie (amerykańskie)','perspektywa','aksonometria'],a:0,e:'E = European = I kąt. A = American = III kąt.'},
  {q:'Krawędź, której nie widać z danego kierunku, rysujemy w rzucie…',o:['linią kreskową','w ogóle jej nie rysujemy – nigdy','linią grubą','linią punktową'],a:0,e:'Krawędzie zakryte – linia kreskowa (można ją pominąć, jeśli nic nie wnosi).'}]},
{id:4,nl:'Maatvoering',t:'Wymiarowanie',d:'Linie wymiarowe, groty, ⌀, R, mm',
 body:()=>`<p>Wymiary mówią wykonawcy, <b>jak duży</b> ma być przedmiot. Zasady opisuje PN-EN ISO 129-1. Na rysunkach maszynowych i stolarskich wymiary liniowe podajemy w <b class="a">milimetrach, bez jednostki</b>.</p>
 <h3><span class="no">01</span>Elementy wymiaru<span class="nl">Maatlijn, hulplijn, pijl</span></h3>${figPlate()}
 <h3><span class="no">02</span>Znaki przed liczbą</h3>
 <table class="tb"><tr><th>Znak</th><th>Znaczenie</th><th>Przykład</th></tr><tr><td>⌀</td><td>średnica</td><td>⌀20</td></tr><tr><td>R</td><td>promień</td><td>R10</td></tr><tr><td>□</td><td>kwadrat</td><td>□40</td></tr><tr><td>S⌀ / SR</td><td>średnica / promień kuli</td><td>SR12</td></tr><tr><td>×</td><td>faza</td><td>2 × 45°</td></tr></table>
 <h3><span class="no">03</span>Zasady</h3>
 <ul class="clean"><li>Każdy wymiar podajemy <b>tylko raz</b> – w rzucie, gdzie jest najczytelniejszy.</li><li>Krawędzie, osie i linie zarysu <b>nie mogą</b> być liniami wymiarowymi.</li><li>Linie wymiarowe nie powinny się przecinać – mniejsze wymiary bliżej przedmiotu, większe dalej.</li><li>Liczby piszemy nad linią, czytelne <b>od dołu</b> lub <b>od prawej</b> strony arkusza.</li><li>Unikamy wymiarowania do krawędzi niewidocznych (kreskowych).</li></ul>
 <h3><span class="no">04</span>Wymiarowanie budowlane<span class="nl">Maatvoering bouwtekening</span></h3>${figBuildDims()}
 <p>Na rysunkach budowlanych zamiast grotów stosuje się <b class="a">ukośne kreski</b> (45°), a wymiary układa w <b>łańcuchy</b>. W Polsce rysunki budowlane często wymiaruje się w cm, w Holandii – w <b>mm</b> (<i>maatvoering</i>).</p>`,
 tryT:'Jak to zapisać?',tryKind:'choice',
 tryTasks:[
  {q:'Otwór o średnicy 12 mm',opts:['⌀12','R12','12⌀','⌀12 mm'],a:0,ex:'Znak ⌀ stoi przed liczbą, bez jednostki: <b>⌀12</b>.'},
  {q:'Zaokrąglenie narożnika promieniem 5 mm',opts:['⌀5','R5','5R','r = 5 mm'],a:1,ex:'Promień: <b>R5</b>.'},
  {q:'Długość blatu 1,2 m na rysunku stolarskim',opts:['1,2 m','120 cm','1200','1.2'],a:2,ex:'W mm, bez jednostki: <b>1200</b>.'},
  {q:'Pręt o przekroju kwadratowym 20 × 20 mm',opts:['20x20mm','□20','K20','⌀20'],a:1,ex:'Kwadrat oznacza się znakiem <b>□20</b>.'},
  {q:'Faza 3 mm pod kątem 45° na krawędzi',opts:['3 × 45°','45 × 3','F3','R3'],a:0,ex:'Fazę zapisujemy jako <b>3 × 45°</b>.'}],
 quiz:[
  {q:'W jakich jednostkach podaje się wymiary na rysunku stolarskim?',o:['W cm, z jednostką','W mm, bez jednostki','W m','W calach'],a:1,e:'Domyślną jednostką są milimetry i nie wpisujemy „mm”.'},
  {q:'Co oznacza zapis ⌀30?',o:['Promień 30 mm','Średnicę 30 mm','Kwadrat 30 mm','Kąt 30°'],a:1,e:'⌀ – średnica.'},
  {q:'Co oznacza zapis R25?',o:['Średnicę 25 mm','Promień 25 mm','Rowek 25 mm','Rozstaw 25 mm'],a:1,e:'R (radius) – promień.'},
  {q:'Czy oś symetrii może być linią wymiarową?',o:['Tak, zawsze','Tak, w skali 1:1','Nie','Tylko w rysunkach budowlanych'],a:2,e:'Osie, krawędzie i zarysy nigdy nie są liniami wymiarowymi (oś można przedłużyć jako linię pomocniczą).'},
  {q:'Liczby wymiarowe przy pionowych liniach wymiarowych piszemy tak, by były czytelne…',o:['do góry nogami','od prawej strony arkusza','od lewej strony arkusza','zawsze poziomo, w poprzek linii'],a:1,e:'Liczby czytamy od dołu lub od prawej strony rysunku.'},
  {q:'O ile linie pomocnicze wystają poza linię wymiarową?',o:['ok. 2 mm','ok. 10 mm','wcale','ok. 5 cm'],a:0,e:'Linie pomocnicze wystają ok. 2 mm (1–3 mm) poza linię wymiarową.'}]},
{id:5,nl:'Doorsneden en arcering',t:'Przekroje i kreskowanie',d:'Płaszczyzna A–A, kreskowanie 45°, materiały',
 body:()=>`<p>Gdy przedmiot ma ukryte wnętrze (otwory, wpusty, kanały), rysowanie wielu linii kreskowych byłoby nieczytelne. Wtedy <b>„przecinamy”</b> go myślowo płaszczyzną i pokazujemy, co widać po przecięciu – to jest <b class="a">przekrój</b> (PN-EN ISO 128-40/50).</p>
 <h3><span class="no">01</span>Jak powstaje przekrój<span class="nl">Doorsnede</span></h3>${figSection()}
 <h3><span class="no">02</span>Kreskowanie<span class="nl">Arcering</span></h3>
 <ul class="clean"><li>Linie <b>cienkie ciągłe</b>, zwykle pod kątem <b class="a">45°</b> do osi lub głównego zarysu.</li><li>Odstęp linii dobrany do wielkości pola (dla małych pól mniejszy).</li><li>Jedna część – w całym rysunku ten sam kierunek i odstęp.</li><li><b>Sąsiednie części</b> kreskujemy w przeciwnych kierunkach albo z innym odstępem.</li><li>W przekroju podłużnym <b>nie kreskuje się</b>: śrub, nitów, kołków, wałków pełnych, żeber, klinów.</li><li>Bardzo cienkie przekroje (blachy, uszczelki) można zaczernić.</li></ul>
 <h3><span class="no">03</span>Rodzaje przekrojów</h3>
 <ul class="clean"><li><b>Przekrój pełny</b> – płaszczyzna przez cały przedmiot.</li><li><b>Półprzekrój</b> – dla brył symetrycznych: pół widoku + pół przekroju, granicą jest oś.</li><li><b>Przekrój cząstkowy</b> – mały fragment, ograniczony linią falistą.</li><li><b>Kład</b> – przekrój „obrócony” i narysowany na widoku lub obok (np. profil listwy).</li></ul>
 <h3><span class="no">04</span>Oznaczenia materiałów<span class="nl">Arceringen materialen</span></h3>${figMaterials()}
 <p>W budownictwie oznaczenia materiałów opisuje PN-B-01030 (w Holandii <i>arceringen</i> wg NEN 47). Zawsze sprawdź legendę na rysunku.</p>`,
 tryT:'Rozpoznaj materiał',tryKind:'choice',
 tryTasks:['beton','drewno','izol','mur','drewnoW'].map(m=>{const pool=shuffle(['metal','drewno','drewnoW','beton','mur','izol'].filter(x=>x!==m)).slice(0,3).concat(m);return {q:`Który symbol oznacza: <b>${SW_NAMES[m]}</b>?`,opts:pool.map(swatch),svgOpts:true,a:3,ex:`To ${SW_NAMES[m]}.`}}),
 quiz:[
  {q:'Jak kreskuje się przekrój?',o:['Grubymi liniami poziomymi','Cienkimi liniami, zwykle pod kątem 45°','Linią kreskową','Linią punktową'],a:1,e:'Kreskowanie: cienkie linie ciągłe, zwykle 45°.'},
  {q:'Dwie stykające się części w przekroju kreskujemy…',o:['tak samo','w przeciwnych kierunkach lub z innym odstępem','tylko jedną z nich','na czarno'],a:1,e:'Zmiana kierunku lub odstępu pokazuje granicę między częściami.'},
  {q:'Jak oznacza się płaszczyznę przekroju?',o:['Linią falistą','Linią punktową cienką z grubymi końcami, strzałkami i literami','Linią dwupunktową','Kolorem czerwonym'],a:1,e:'Np. A–A: punktowa cienka, pogrubione końce, strzałki kierunku patrzenia, litery.'},
  {q:'Czego NIE kreskuje się w przekroju podłużnym?',o:['Korpusu','Pełnych wałków, śrub i kołków','Ścian z cegły','Desek'],a:1,e:'Elementów pełnych typu śruby, kołki, wałki, żebra nie przecina się wzdłuż.'},
  {q:'Półprzekrój stosuje się dla przedmiotów…',o:['symetrycznych','bardzo długich','z drewna','bez otworów'],a:0,e:'Połowa widoku + połowa przekroju – sensowne tylko przy symetrii.'},
  {q:'Przekrój cząstkowy ogranicza się linią…',o:['falistą cienką','grubą ciągłą','kreskową','dwupunktową'],a:0,e:'Granicę przekroju cząstkowego rysujemy cienką linią falistą (lub zygzakową).'}]},
{id:6,nl:'Isometrie en axonometrie',t:'Aksonometria i izometria',d:'Rysunek „3D” na płaskiej kartce',
 body:()=>`<p>Aksonometria pokazuje przedmiot w jednym, poglądowym rysunku – widać trzy ściany naraz. Przydaje się do szkiców, instrukcji montażu i katalogów (PN-EN ISO 5456-3).</p>
 <h3><span class="no">01</span>Osie<span class="nl">Isometrie</span></h3>${figAxes()}
 <ul class="clean"><li><b>Izometria</b> – osie co <b class="a">120°</b>, osie x i y nachylone <b class="a">30°</b> do poziomu. W praktyce wszystkie wymiary odkładamy <b>1 : 1</b> (izometria uproszczona).</li><li><b>Dimetria ukośna</b> – przód rysujemy w prawdziwym kształcie, głębokość pod kątem <b class="a">45°</b> ze skrótem <b>0,5</b>.</li></ul>
 <h3><span class="no">02</span>Okręgi</h3>${figCubes()}
 <p>W izometrii każdy okrąg staje się <b>elipsą</b>. W dimetrii ukośnej okręgi na ścianie przedniej pozostają okręgami – dlatego jest wygodna dla przedmiotów z otworami od frontu.</p>
 <h3><span class="no">03</span>Jak narysować bryłę w izometrii</h3>
 <ol class="clean"><li>Narysuj osie: pionową i dwie pod 30°.</li><li>Narysuj „pudełko” o wymiarach całkowitych (dł. × szer. × wys.).</li><li>Odmierzaj wymiary <b>tylko wzdłuż osi</b> (lub do nich równolegle).</li><li>Wycinaj z pudełka zbędne części, na końcu pogrub widoczne krawędzie.</li></ol>
 <div class="tip">Krawędzie równoległe w rzeczywistości są równoległe także na rysunku izometrycznym – to dobry test poprawności szkicu.</div>`,
 tryT:'Zbuduj bryłę z klocków',tryKind:'builder',
 quiz:[
  {q:'Jakie kąty tworzą osie w izometrii?',o:['90°','120°','45°','60°'],a:1,e:'Trzy osie co 120°.'},
  {q:'Pod jakim kątem do poziomu biegną osie x i y w izometrii?',o:['15°','30°','45°','60°'],a:1,e:'30° w lewo i w prawo od poziomu.'},
  {q:'Jaki skrót stosuje się na osi głębokości w dimetrii ukośnej?',o:['1','0,82','0,5','0,25'],a:2,e:'Głębokość rysujemy o połowę krótszą.'},
  {q:'Jak wygląda okrąg w rzucie izometrycznym?',o:['Jak okrąg','Jak elipsa','Jak kwadrat','Jak romb'],a:1,e:'Okręgi na ścianach izometrii stają się elipsami.'},
  {q:'W izometrii uproszczonej wymiary wzdłuż osi odkładamy…',o:['w skali 1 : 1','skrócone o połowę','skrócone do 0,82','dowolnie'],a:0,e:'Uproszczona izometria – wszystkie trzy osie 1 : 1 (rysunek jest ok. 22% większy od teoretycznego, ale proporcje są zachowane).'}]},
];
/* ===== helpers for new lessons ===== */
const numL=(x,y,tx,ty,n)=>L(x,y,tx,ty,'c')+`<circle cx="${f(tx)}" cy="${f(ty)}" r="2" fill="#ff9a1f"/>`+num(x,y,n);
const lvl=(x,y,t)=>`<path d="M${f(x-4)},${f(y-7)} H${f(x+4)} L${f(x)},${f(y)} Z" fill="none" stroke="#eaf4ff" stroke-width="1.2"/>`+L(x-7,y,x+7,y)+T(x+7,y-3,t,'t','style="font-size:9px"');
const wave=(x,y1,y2)=>{let d=`M${x},${y1}`;for(let y=y1;y<y2;y+=20)d+=` q 5,5 0,10 q -5,5 0,10`;return `<path class="c" d="${d}"/>`};
function woodFill(d,cx,cy,id,radii=[6,12,19,27,36,46,57,69,82]){return `<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">${radii.map(r=>`<circle cx="${cx}" cy="${cy}" r="${r}" class="c"/>`).join('')}</g><path class="k" d="${d}" style="stroke-width:1.8"/>`}

/* --- building drawing figures --- */
function figSectionV(){
  const Z=mm=>215-mm/15;let s='';
  s+=`<rect x="31.5" y="${f(Z(-500))}" width="40" height="20" fill="url(#pConc)" class="k"/>`;
  s+=`<rect x="40" y="${f(Z(900))}" width="6.7" height="${f(Z(-500)-Z(900))}" fill="url(#pBrick)"/><rect x="40" y="${f(Z(3100))}" width="6.7" height="${f(Z(2300)-Z(3100))}" fill="url(#pBrick)"/>`;
  s+=`<rect x="56.7" y="${f(Z(900))}" width="6.6" height="${f(Z(-500)-Z(900))}" fill="url(#p135)"/><rect x="56.7" y="${f(Z(2600))}" width="6.6" height="${f(Z(2300)-Z(2600))}" fill="url(#p135)"/>`;
  s+=`<rect x="46.7" y="${f(Z(900))}" width="8" height="${f(Z(-300)-Z(900))}" fill="url(#pIns)"/><rect x="46.7" y="${f(Z(2950))}" width="8" height="${f(Z(2300)-Z(2950))}" fill="url(#pIns)"/>`;
  s+=`<path class="k" style="stroke-width:1.6" d="M40,${f(Z(-500))} V${f(Z(900))} H46.7 V${f(Z(-500))} M40,${f(Z(2300))} V${f(Z(3100))} H46.7 V${f(Z(2300))} Z M56.7,${f(Z(-500))} V${f(Z(900))} H63.3 V${f(Z(-500))} M56.7,${f(Z(2300))} V${f(Z(2600))} M63.3,${f(Z(2300))} V${f(Z(2600))} M56.7,${f(Z(2300))} H63.3"/>`;
  s+=`<rect x="46.7" y="${f(Z(2300))}" width="10" height="${f(Z(900)-Z(2300))}" class="k" style="stroke-width:1.6"/>`+L(50.7,Z(2300)+3,50.7,Z(900)-3)+L(52.7,Z(2300)+3,52.7,Z(900)-3)+`<rect x="40" y="${f(Z(2300))}" width="6.7" height="3" fill="#8fc7ff"/>`;
  s+=`<rect x="63.3" y="${f(Z(0))}" width="236.7" height="${f(Z(-200)-Z(0))}" fill="url(#pConc)"/><rect x="56.7" y="${f(Z(2800))}" width="243.3" height="${f(Z(2600)-Z(2800))}" fill="url(#pConc)"/><rect x="56.7" y="${f(Z(2950))}" width="243.3" height="${f(Z(2800)-Z(2950))}" fill="url(#pIns)"/>`;
  s+=`<path class="k" style="stroke-width:1.6" d="M300,${f(Z(0))} H63.3 M63.3,${f(Z(-200))} H300 M300,${f(Z(2600))} H63.3 M56.7,${f(Z(2800))} H300 M56.7,${f(Z(2950))} H300 M56.7,${f(Z(2950))} V${f(Z(2600))}"/>`;
  s+=L(0,Z(-150),40,Z(-150),'k');for(let x=4;x<40;x+=7)s+=L(x,Z(-150)+1,x-5,Z(-150)+7);
  s+=L(63.3,Z(-650),300,Z(-650));for(let x=70;x<300;x+=12)s+=L(x,Z(-650)+1,x-5,Z(-650)+7);
  s+=wave(300,8,248);
  s+=T(185,128,'pomieszczenie','tb','text-anchor="middle"')+T(185,141,'(ruimte)','tb','text-anchor="middle"')+T(185,Z(-420),'kruipruimte','tb','text-anchor="middle" style="font-size:9px"');
  s+=dim(240,Z(0),240,Z(2600),0,'2600',{noExt:true,tick:true});
  [[2800,'+2,80'],[2600,'+2,60'],[0,'±0,00'],[-150,'−0,15'],[-800,'−0,80']].forEach(([mm,t])=>{s+=`<line x1="300" y1="${f(Z(mm))}" x2="312" y2="${f(Z(mm))}" stroke="#6f9fd6" stroke-width=".7" stroke-dasharray="2 3"/>`+lvl(318,Z(mm),t)});
  s+=numL(16,190,43,200,1)+numL(16,165,50,170,2)+numL(92,180,61,190,3)+numL(170,62,170,24,4)+numL(140,195,140,222,5)+numL(98,262,70,258,6)+numL(92,110,52,110,7)+num(335,120,8)+numL(16,240,22,225,9);
  return fig(svg('0 0 352 280',s),'Przekrój pionowy (doorsnede) przez ścianę zewnętrzną – oryginał 1:20, rzędne w m')+
  legend(['mur zewnętrzny z cegły (buitenblad, metselwerk)','izolacja termiczna w szczelinie (spouwisolatie) + pustka powietrzna (spouw)','mur wewnętrzny – nośny, np. silikaty (binnenblad, kalkzandsteen)','strop/dach żelbetowy z izolacją (dakvloer + isolatie)','strop parteru nad kanałem (begane grondvloer boven kruipruimte)','ława fundamentowa (fundering, beton)','okno w przekroju: rama (kozijn) z szybą zespoloną; nad otworem nadproże (latei)','rzędne – wysokości względem ±0,00 (NL: peil). W NL często w mm: P + 2600','linia terenu (maaiveld, mv) – gruba, z kreskowaniem gruntu'])}
function figElevation(){
  const Y=mm=>180-mm/30;let s='';
  s+=`<rect x="30" y="96" width="280" height="89" class="k"/>`;
  s+=`<path class="k" d="M14,96 L170,20 L326,96 M26,96 L170,30 L314,96 M14,96 H26 M314,96 H326"/>`;
  s+=`<rect x="160" y="55" width="20" height="20" class="k" style="stroke-width:1.6"/>`+L(170,55,170,75);
  s+=`<rect x="80" y="${f(Y(2300))}" width="31" height="${f(Y(0)-Y(2300))}" class="k"/><rect x="84" y="${f(Y(2300)+4)}" width="23" height="${f(Y(0)-Y(2300)-4)}" class="c"/><circle cx="103" cy="${f(Y(1050))}" r="1.6" fill="#eaf4ff"/>`;

{id:8,nl:'Houtverbindingen en meubeltekening',t:'Rysunek stolarski',d:'Połączenia, słoje, lista cięć, złożenie',
 body:()=>`<p>Rysunek stolarski (NL: <i>werktekening</i> dla mebla lub stolarki) rysuje się w skalach <b>1 : 1 – 1 : 10</b>, z wymiarami w <b class="a">mm</b>. Składa się zwykle z rysunku złożeniowego, rysunków części, detali połączeń i listy elementów.</p>
 <h3><span class="no">01</span>Połączenia stolarskie<span class="nl">Houtverbindingen</span></h3>${figJoints()}
 <ul class="clean"><li><b>Czop i gniazdo</b> – grubość czopa ok. <b>1/3</b> grubości elementu; ukryte gniazdo rysujemy linią kreskową, a oś – punktową.</li><li><b>Pióro i wpust</b> – łączenie desek wzdłuż krawędzi (podłogi, boazerie, blaty). Pokazujemy je w przekroju, z oznaczeniem drewna.</li><li><b>Jaskółczy ogon</b> – połączenie narożne szuflad i skrzyń; nachylenie ogonów ok. <b>1:6</b> (drewno iglaste) lub <b>1:8</b> (liściaste).</li><li><b>Kołki</b> – zwykle ⌀6, ⌀8 lub ⌀10; średnica ok. 1/3–1/2 grubości płyty (np. ⌀8 dla 18 mm). Zapis: <b>⌀8×35</b>.</li></ul>
 <h3><span class="no">02</span>Kierunek słojów<span class="nl">Vezelrichting</span></h3>${figGrain()}
 <p>Kierunek włókien wpływa na wytrzymałość i wygląd (rysunek słojów), a przy płytach fornirowanych – na rozkrój. Zaznaczamy go <b>podwójną strzałką</b> na rysunku części i kolumną w liście elementów.</p>
 <h3><span class="no">03</span>Rysunek złożeniowy i widok rozstrzelony<span class="nl">Samenstellings- en explosietekening</span></h3>${figExploded()}
 <ul class="clean"><li>Każda część ma <b>numer pozycji</b> w kółku (z linią odniesienia), zgodny z listą elementów.</li><li>Widok rozstrzelony rozsuwa części wzdłuż kierunków montażu – widać kolejność składania.</li><li>Do każdej pozycji wykonuje się osobny rysunek wykonawczy z pełnym wymiarowaniem.</li></ul>
 <h3><span class="no">04</span>Lista elementów<span class="nl">Zaaglijst / materiaalstaat</span></h3>${cutTable()}
 <div class="tip"><b>Sprawdź wymiary:</b> wysokość taboretu = 432 (bok) + 18 (siedzisko) = <b>450 mm</b>; długość listwy = 360 − 2 × 18 = <b>324 mm</b>.</div>`,
 tryT:'Rozpoznaj połączenie',tryKind:'choice',
 tryTasks:[...['czop','wpust','jaskol','kolek'].map(k=>{const pool=['czop','wpust','jaskol','kolek'];return{q:`Który rysunek przedstawia: <b>${JOINTS[k][0]}</b> (<i>${JOINTS[k][1]}</i>)?`,opts:pool.map(j=>jointSVG(j).replace(/<text[^>]*>[^<]*<\/text>/g,'')),svgOpts:true,a:pool.indexOf(k),ex:`To ${JOINTS[k][0].toLowerCase()} – ${JOINTS[k][1]}.`}}),
  {q:'Lista elementów: „Bok – 432 × 280 × 18, włókna: wzdłuż 432”. Jak wyciąć element z deski?',opts:['Długość 432 wzdłuż włókien','Długość 432 w poprzek włókien','Dowolnie','Po skosie 45°'],a:0,ex:'Pierwszy wymiar (długość) zawsze <b>wzdłuż włókien</b>.'}],
 quiz:[
  {q:'Jaka jest typowa grubość czopa w połączeniu czopowym?',o:['ok. 1/3 grubości elementu','cała grubość elementu','ok. 1/10 grubości','dwa razy grubość'],a:0,e:'Reguła 1/3: czop i dwie ścianki gniazda mają podobną grubość.'},
  {q:'Do czego najczęściej używa się połączenia na pióro i wpust (messing en groef)?',o:['Do łączenia desek wzdłuż krawędzi – podłogi, boazerie','Do narożników szuflad','Do mocowania zawiasów','Do łączenia metalu'],a:0,e:'Pióro wchodzi we wpust sąsiedniej deski – powstaje równa, szczelna płaszczyzna.'},
  {q:'Jakie nachylenie ogonów jaskółczych stosuje się zwykle w drewnie liściastym?',o:['1:2','1:8','1:20','45°'],a:1,e:'Ok. 1:8 w drewnie liściastym, ok. 1:6 w iglastym.'},
  {q:'Co oznacza zapis „⌀8×35” przy kołku?',o:['średnica 8 mm, długość 35 mm','8 kołków po 35 mm','promień 8, długość 35','35 kołków ⌀8'],a:0,e:'Średnica × długość, w mm.'},
  {q:'Czego NIE znajdziesz zwykle w liście elementów (zaaglijst)?',o:['Liczby sztuk','Wymiarów netto','Kierunku włókien','Ceny wkrętarki'],a:3,e:'Lista elementów: pozycja, nazwa, ilość, wymiary, materiał, kierunek włókien.'},
  {q:'Co pokazuje widok rozstrzelony (explosietekening)?',o:['Części rozsunięte wzdłuż kierunków montażu','Tylko jeden element w przekroju','Rzut z góry mebla','Rysunek w skali 1:100'],a:0,e:'Widać wszystkie części i to, jak się składają, a numery pozycji odsyłają do listy elementów.'}]},
{id:9,nl:'Nederlandse termen en afkortingen',t:'Holenderskie zwroty i skróty',d:'Słowniczek NL → PL, wymowa, fiszki',
 body:()=>`<p>Na holenderskiej budowie i w warsztacie rysunki są opisane po niderlandzku. Poniżej najważniejsze terminy i skróty. Dotknij 🔊, aby usłyszeć wymowę (jeśli w telefonie jest głos holenderski).</p>

 <div class="tip">Skróty zapisuje się zwykle małymi literami z kropkami: <b>b.k.</b>, <b>o.k.</b>, <b>h.o.h.</b>. Wysokości: <b>P</b> (peil) = ±0,00, a <b>NAP</b> = poziom odniesienia całej Holandii.</div>
 ${glossTable()}`,

 quiz:[
  {q:'Co oznacza „bordes”?',o:['Poręcz','Spocznik','Stopień','Próg'],a:1,e:'Bordes – spocznik schodów.'},
  {q:'„Optrede” to…',o:['wysokość stopnia','głębokość stopnia','szerokość biegu','długość poręczy'],a:0,e:'Optrede – wysokość stopnia; aantrede – głębokość w rzucie.'},
  {q:'Drewno „vuren” to…',o:['dąb','sosna','świerk','buk'],a:2,e:'Vuren(hout) – świerk. Sosna to grenen, dąb – eiken, buk – beuken.'},
  {q:'„Latei” to…',o:['nadproże','listwa przypodłogowa','łata dachowa','próg'],a:0,e:'Latei – nadproże nad otworem okiennym lub drzwiowym.'},
  {q:'Skrót „o.k.” oznacza…',o:['górną krawędź','dolną krawędź (onderkant)','oś konstrukcyjną','otwór'],a:1,e:'o.k. = onderkant – spód; b.k. = bovenkant – wierzch.'},
  {q:'„Werktekening” to…',o:['rysunek wykonawczy','rysunek przetargowy','plan działki','faktura'],a:0,e:'Werktekening – rysunek wykonawczy/warsztatowy; bestektekening – do opisu technicznego (bestek) na etapie przetargu.'}]});
/* ===== FLASHCARDS (Fiszki) ===== */
function fiszki(){
  head('<span>Fiszki</span> NL ↔ PL','#/lekcja/9');
  let st=store.get('fc',{}),dir=store.get('fc_dir','nl'),only=store.get('fc_only',false),deck=[],i=0,flipped=false;
  const known=()=>GLOSS.filter(g=>st[g.nl]&&st[g.nl].k).length;
  const build=()=>{deck=shuffle(GLOSS.filter(g=>!only||!(st[g.nl]&&st[g.nl].k)));i=0;flipped=false};
  const hasTTS='speechSynthesis' in window;
  app().innerHTML=`<div class="seg" id="fdir"><button data-d="nl">NL → PL</button><button data-d="pl">PL → NL</button></div>
  <div class="seg" id="fonly"><button data-o="0">Wszystkie</button><button data-o="1">Tylko „nie znam”</button><button id="fshuf">🔀 Tasuj</button></div>
  <div class="qhead"><span id="fcnt"></span><span>Znam: <b class="acc" id="fkn"></b> / ${GLOSS.length}</span></div><div class="prog"><i id="fpr"></i></div>
  <div id="fcard"></div>
  <p class="small center" id="tts">${hasTTS?'':'Ta przeglądarka nie obsługuje syntezy mowy.'}</p>
  <div class="row"><button class="btn" id="freset">Wyzeruj fiszki</button><a class="btn" href="#/lekcja/9">Słowniczek</a></div>`;
  const seg=()=>{$$('#fdir button').forEach(b=>b.classList.toggle('on',b.dataset.d===dir));$$('#fonly button[data-o]').forEach(b=>b.classList.toggle('on',(b.dataset.o==='1')===only))};
  const stats=()=>{$('#fkn').textContent=known();$('#fpr').style.width=(known()/GLOSS.length*100)+'%'};
  const render=()=>{seg();stats();const el=$('#fcard');
    if(!deck.length){el.innerHTML=`<div class="card center"><div style="font-size:44px">🏆</div><h2>Znasz wszystkie słówka!</h2><p class="small">Przełącz na „Wszystkie”, aby powtórzyć.</p></div>`;$('#fcnt').textContent='';return}
    if(i>=deck.length){el.innerHTML=`<div class="card center"><h2>Koniec talii 👍</h2><p>Znasz ${known()} z ${GLOSS.length} słówek.</p><div class="row"><button class="btn acc" id="fagain">Jeszcze raz (tasuj)</button></div></div>`;$('#fcnt').textContent=`${deck.length} / ${deck.length}`;$('#fagain').onclick=()=>{build();render()};return}
    const g=deck[i],front=dir==='nl'?g.nl:g.pl,back=dir==='nl'?g.pl:g.nl,s=st[g.nl];
    $('#fcnt').textContent=`Karta ${i+1} / ${deck.length}`;
    el.innerHTML=`<button class="fc ${flipped?'f':''}" id="fc" aria-label="Odwróć kartę"><div class="in"><div class="ba"><span class="small">${g.cat} · ${dir==='nl'?'NEDERLANDS':'POLSKI'}</span><div class="w">${front}</div><span class="small">dotknij, aby odwrócić</span></div><div class="fa"><span class="small">${dir==='nl'?'POLSKI':'NEDERLANDS'}</span><div class="w">${back}</div>${s?`<span class="small">${s.k?'✓ oznaczone jako znane':'✗ do powtórki'}</span>`:''}</div></div></button>
    <div class="row">${hasTTS?`<button class="btn" id="fsay">🔊 Wymów (NL)</button>`:''}</div>
    <div class="row"><button class="btn" id="fno" style="border-color:var(--bad)">✗ Nie znam</button><button class="btn acc" id="fyes">✓ Znam</button></div>`;
    $('#fc').onclick=()=>{flipped=!flipped;$('#fc').classList.toggle('f',flipped);beep(700,.03)};
    if(hasTTS)$('#fsay').onclick=()=>{speakNL(g.say);if(!nlVoice)$('#tts').textContent='Brak holenderskiego głosu w urządzeniu – używam domyślnego (zainstaluj głos „Nederlands” w ustawieniach syntezy mowy).'};
    const mark=k=>{st[g.nl]={k:k?1:0,n:((st[g.nl]&&st[g.nl].n)||0)+1,t:Date.now()};store.set('fc',st);k?sGood():beep(300,.08,'triangle',.05);i++;flipped=false;render()};
    $('#fyes').onclick=()=>mark(true);$('#fno').onclick=()=>mark(false)};
  $$('#fdir button').forEach(b=>b.onclick=()=>{dir=b.dataset.d;store.set('fc_dir',dir);flipped=false;render()});
  $$('#fonly button[data-o]').forEach(b=>b.onclick=()=>{only=b.dataset.o==='1';store.set('fc_only',only);build();render()});
  $('#fshuf').onclick=()=>{build();render();beep(500,.05)};
  $('#freset').onclick=()=>{if(confirm('Wyzerować oznaczenia „znam / nie znam”?')){st={};store.set('fc',st);build();render()}};
  build();render()}
/* ===== layout helpers ===== */

let backTo='#/';

function lessonProgress(){const n=LESSONS.filter(l=>P.done[l.id]).length;return{n,pct:Math.round(n/LESSONS.length*100)}}

  <div class="small">${next?`Następna: <b>${next.id}. ${next.t}</b>`:'Wszystkie lekcje zaliczone – świetna robota! 🎉'}</div>

  <h3><span class="no">//</span>Ćwiczenia i gry</h3>

   <a class="tile" href="#/rzuty"><div class="ic">🧊</div><strong>Dopasuj rzuty</strong><span class="small">Wybierz właściwy rzut z góry${P.views.best?` · rekord ${P.views.best}`:''}</span></a>
   <a class="tile" href="#/szkic"><div class="ic">✏️</div><strong>Szkicownik</strong><span class="small">Rysuj linie na siatce, palcem</span></a>
   <a class="tile" href="#/gry/slowka"><div class="ic">⏱️</div><strong>Wyścig słówek</strong><span class="small">NL ↔ PL na czas${store.get('wr_best',0)?` · rekord ${store.get('wr_best',0)}`:''}</span></a>
   <a class="tile" href="#/fiszki"><div class="ic">🗂️</div><strong>Fiszki NL ↔ PL</strong><span class="small">${GLOSS.length} słówek · znam ${GLOSS.filter(g=>(store.get('fc',{})[g.nl]||{}).k).length}</span></a>
   <a class="tile" href="#/lekcja/9"><div class="ic">🇳🇱</div><strong>Słowniczek NL</strong><span class="small">Terminy i skróty z wymową</span></a>
   <a class="tile" href="#/gry/memory"><div class="ic">🃏</div><strong>Memory symboli</strong><span class="small">Symbol ↔ nazwa PL/NL</span></a>
  </div>
  <div class="row"><button class="btn" id="reset">Wyzeruj postęp</button></div>
  <p class="small center">Działa offline. Dodaj do ekranu głównego: menu przeglądarki → „Dodaj do ekranu głównego”.</p>`;
  $('#reset').onclick=()=>{if(confirm('Na pewno usunąć cały postęp i wyniki?')){P={done:{},quiz:{},seen:{},views:{best:0},try:{}};saveP();['wr_best','mem_best','sketch','fc'].forEach(k=>store.set(k,null));home()}};
}

/* ===== LESSON ===== */
function lesson(id){
  const l=LESSONS.find(x=>x.id==id);if(!l)return home();P.seen[l.id]=1;saveP();
  head(`<span>${String(l.id).padStart(2,'0')}</span> ${l.t}`,'#/');
  const q=P.quiz[l.id],nx=LESSONS.find(x=>x.id===l.id+1);
  app().innerHTML=`<h2>${l.t}</h2>${l.nl?`<span class="nlsub">NL: ${l.nl}</span>`:''}${l.body()}
  <div class="card try" id="try"><h3>✍️ Spróbuj: ${l.tryT}</h3><div id="tryBody"></div></div>
  <div class="card"><h3 style="margin-top:0">📝 Quiz – ${l.quiz.length} pytań</h3><p class="small">Zalicz quiz (min. 60%), aby oznaczyć lekcję jako ukończoną.${q?` Najlepszy wynik: <b class="acc">${q.best}/${q.n}</b>.`:''}</p>
  <div class="row"><a class="btn acc" href="#/quiz/${l.id}">Rozpocznij quiz</a></div></div>
  <div class="row">${l.id>1?`<a class="btn" href="#/lekcja/${l.id-1}">← Poprzednia</a>`:''}${nx?`<a class="btn" href="#/lekcja/${nx.id}">Następna →</a>`:''}</div>`;
  const tb=$('#tryBody');
  if(l.tryKind==='choice')choiceTask(tb,l.tryTasks,()=>{P.try[l.id]=1;saveP()});
  else if(l.tryKind==='scale')scaleCalc(tb);
  else if(l.tryKind==='views3')views3(tb);
  else if(l.tryKind==='builder')builder(tb);
}
/* legend hotspot interaction */
document.addEventListener('click',e=>{const g=e.target.closest('.nm');if(!g)return;const figEl=g.closest('figure');let lg=figEl&&figEl.nextElementSibling;if(!lg||!lg.classList.contains('lg'))return;
  $$('li',lg).forEach(li=>li.classList.toggle('on',li.dataset.n===g.dataset.n));const li=$(`li[data-n="${g.dataset.n}"]`,lg);if(li)li.scrollIntoView({block:'nearest',behavior:'smooth'});beep(880,.05)});

/* generic multiple choice sequence */
function choiceTask(el,tasks,onDone){
  let i=0,ok=0;
  const render=()=>{
    if(i>=tasks.length){el.innerHTML=`<div class="score">${ok}/${tasks.length}</div><p class="center">${ok===tasks.length?'Bezbłędnie! 👏':'Dobrze – powtórz, by utrwalić.'}</p><div class="row"><button class="btn" id="again">Jeszcze raz</button></div>`;$('#again',el).onclick=()=>{i=0;ok=0;render()};onDone&&onDone();return}
    const t=tasks[i],order=shuffle(t.opts.map((_,k)=>k));
    el.innerHTML=`<div class="qhead"><span>Zadanie ${i+1} z ${tasks.length}</span><span>✓ ${ok}</span></div><p><b>${t.q}</b></p><div class="opts ${t.svgOpts?'optsv':''}">${order.map((k,n)=>`<button class="opt" data-k="${k}">${t.svgOpts?'':`<span class="ltr">${LETTERS[n]}</span>`}${t.opts[k]}</button>`).join('')}</div><div id="fb"></div>`;
    $$('.opt',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.k,good=k===t.a;if(good){ok++;sGood()}else sBad();
      $$('.opt',el).forEach(x=>{x.disabled=true;if(+x.dataset.k===t.a)x.classList.add('good')});if(!good)b.classList.add('wrong');
      $('#fb',el).innerHTML=`<div class="fb ${good?'good':'wrong'}">${good?'✓ Dobrze! ':'✗ Nie tym razem. '}${t.ex||''}</div><div class="row"><button class="btn acc" id="nx">${i+1<tasks.length?'Dalej →':'Wynik'}</button></div>`;
      $('#nx',el).onclick=()=>{i++;render()}})};
  render()}

/* scale calculator */
function scaleCalc(el){

function quiz(id){

  const qs=l.quiz.map(q=>{const ord=shuffle(q.o.map((_,i)=>i));return{...q,ord}});let i=0,ok=0;const res=[];
  const render=()=>{
    if(i>=qs.length)return finish();
    const q=qs[i];
    app().innerHTML=`<div class="card"><div class="qhead"><span>Pytanie ${i+1} / ${qs.length}</span><span>✓ ${ok}</span></div><div class="dots">${qs.map((_,k)=>`<i class="${k<i?(res[k]?'g':'w'):k===i?'c':''}"></i>`).join('')}</div>

    $$('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,good=k===q.a;res[i]=good;if(good){ok++;sGood()}else sBad();

      $('#nx').onclick=()=>{i++;render();window.scrollTo(0,0)}})};
  const finish=()=>{const n=qs.length,pass=ok/n>=.6,prev=P.quiz[l.id];P.quiz[l.id]={best:Math.max(ok,prev?prev.best:0),n,last:ok};if(pass)P.done[l.id]=1;saveP();if(pass)sWin();

    $('#rep').onclick=()=>quiz(id)};

const VX=[

function vxOptions(item,all){
  const m=unit(item.r),sv=mm=>viewSVG(mm,'T',{s:22,pad:6});
  const correct=sv(m);
  const cand=[{s:sv(unit(item.r.map(r=>r.slice().reverse()))),why:'To odbicie lustrzane – lewa i prawa strona zamienione.'},
    {s:sv(unit(item.r.slice().reverse())),why:'Przód i tył zamienione miejscami – pamiętaj: w rzucie z góry przód bryły jest na dole.'},
    {s:viewSVG(m,'F',{s:22,pad:6}),why:'To rzut główny (widok z przodu), a nie z góry.'},
    {s:sv(unit(item.r[0].map((_,x)=>item.r.map(r=>r[x])))),why:'Ten rzut jest obrócony o 90°.'},
    ...shuffle(all.filter(o=>o!==item)).map(o=>({s:sv(unit(o.r)),why:'To rzut z góry zupełnie innej bryły.'}))];
  const seen=new Set([correct]),opts=[{s:correct,ok:true}];
  for(const c of cand){if(opts.length>=4)break;if(!seen.has(c.s)){seen.add(c.s);opts.push(c)}}
  return shuffle(opts)}

const SK_TYPES=[{k:'k',w:2.6,d:[]},{k:'c',w:1.1,d:[]},{k:'h',w:1.1,d:[8,4]},{k:'o',w:1.1,d:[20,4,2,4]},{k:'o2',w:1.1,d:[20,4,2,4,2,4]},{k:'ko',w:2.6,d:[20,4,2,4]}];
function sketch(){
  head('<span>Szkicownik</span>','#/');
  let lines=store.get('sketch',null)||[],type=0,snap=true,ortho=true,cur=null;
  app().innerHTML=`<p class="small">Przeciągnij palcem, aby narysować odcinek. 1 kratka = 5 mm. Wybierz rodzaj linii:</p>
  <div class="ltsel" id="lts">${SK_TYPES.map((t,i)=>`<button data-i="${i}" class="${i?'':'on'}">${lineSample(t.k,62).replace('class="ls"','')}<span>${LINE_TYPES[t.k].n}</span></button>`).join('')}</div>
  <div class="canvasWrap" id="cw"><canvas id="cv"></canvas><div class="readout" id="ro">gotowy</div></div>
  <div class="seg"><button id="snap" class="on">Przyciągaj do siatki</button><button id="orth" class="on">Tylko 0° / 45° / 90°</button></div>
  <div class="row"><button class="btn" id="undo">↶ Cofnij</button><button class="btn" id="clr">Wyczyść</button></div>
  <div class="card"><b class="acc">Zadanie:</b> narysuj rzut główny klocka L z lekcji 3 (60 × 40 mm, stopień 30 × 20 mm): zarys linią grubą, oś punktową, a na koniec linię wymiarową cienką.</div>`;
  const cv=$('#cv'),cw=$('#cw'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1;const G=10;
  const size=()=>{dpr=window.devicePixelRatio||1;W=cw.clientWidth;H=Math.round(Math.min(window.innerHeight*.58,W*1.25));cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw()};
  const drawLine=(l,prev)=>{const t=SK_TYPES[l.t];ctx.beginPath();ctx.setLineDash(t.d);ctx.lineWidth=t.w;ctx.strokeStyle=prev?'#ff9a1f':(t.w>2?'#eaf4ff':'#9fd0ff');ctx.lineCap='butt';ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();ctx.setLineDash([])};
  function draw(){ctx.fillStyle='#0b2a50';ctx.fillRect(0,0,W,H);
    for(let x=0;x<=W;x+=G){ctx.strokeStyle=x%(G*5)?'rgba(143,199,255,.12)':'rgba(143,199,255,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);ctx.stroke()}
    for(let y=0;y<=H;y+=G){ctx.strokeStyle=y%(G*5)?'rgba(143,199,255,.12)':'rgba(143,199,255,.3)';ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke()}
    lines.forEach(l=>drawLine(l));if(cur)drawLine(cur,true)}
  const pt=e=>{const r=cv.getBoundingClientRect();let x=e.clientX-r.left,y=e.clientY-r.top;if(snap){x=Math.round(x/G)*G;y=Math.round(y/G)*G}return[x,y]};
  const constrain=(x1,y1,x,y)=>{if(!ortho)return[x,y];const dx=x-x1,dy=y-y1,a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4),len=Math.hypot(dx,dy);let px=Math.cos(a),py=Math.sin(a);let d=Math.abs(px)>.1&&Math.abs(py)>.1?Math.round(len*Math.SQRT1_2/(snap?G:1))*(snap?G:1)/Math.SQRT1_2:len;if(snap&&!(Math.abs(px)>.1&&Math.abs(py)>.1))d=Math.round(len/G)*G;return[x1+px*d,y1+py*d]};
  const mm=l=>Math.round(Math.hypot(l.x2-l.x1,l.y2-l.y1)/G*5);
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cur={x1:x,y1:y,x2:x,y2:y,t:type};draw()});
  cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();const[x,y]=pt(e);[cur.x2,cur.y2]=constrain(cur.x1,cur.y1,x,y);$('#ro').textContent=`${LINE_TYPES[SK_TYPES[type].k].n} · ${mm(cur)} mm`;draw()});
  const up=()=>{if(!cur)return;if(Math.hypot(cur.x2-cur.x1,cur.y2-cur.y1)>=G*.9){lines.push(cur);store.set('sketch',lines);beep(520,.04)}cur=null;draw()};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',()=>{cur=null;draw()});
  $$('#lts button').forEach(b=>b.onclick=()=>{type=+b.dataset.i;$$('#lts button').forEach(x=>x.classList.toggle('on',x===b));$('#ro').textContent=LINE_TYPES[SK_TYPES[type].k].n});
  $('#snap').onclick=e=>{snap=!snap;e.target.classList.toggle('on',snap)};$('#orth').onclick=e=>{ortho=!ortho;e.target.classList.toggle('on',ortho)};
  $('#undo').onclick=()=>{lines.pop();store.set('sketch',lines);draw()};$('#clr').onclick=()=>{if(!lines.length||confirm('Wyczyścić cały rysunek?')){lines=[];store.set('sketch',lines);draw()}};
  const ro=()=>size();window.addEventListener('resize',ro);onCleanup(()=>window.removeEventListener('resize',ro));size()}

    function end(){if(over)return;over=true;clearInterval(iv);const rec=score>best();if(rec)store.set('wr_best',score);rec&&score>0?sWin():beep(300,.3,'triangle',.06);
      app().innerHTML=`<div class="card center"><h2>${lives<=0?'Koniec żyć!':'Czas minął!'}</h2><div class="score">${score}</div>${rec&&score>0?'<p><span class="badge">🏆 Nowy rekord!</span></p>':`<p class="small">Rekord: ${best()}</p>`}
      <p>Trafienia: <b class="acc">${good}</b> · Błędy: <b>${bad}</b> · Najdłuższa seria: <b>${maxCombo}</b></p>

      <div class="row"><button class="btn acc" id="again">Zagraj ponownie</button><a class="btn" href="#/gry">Inne gry</a></div></div>`;$('#again').onclick=start}
    hud();nextQ();tick()};
  app().innerHTML=`<div class="card center"><div style="font-size:54px">⏱️</div><h2>Wyścig słówek</h2><p>Masz <b class="acc">60 sekund</b> i <b class="acc">3 życia</b>. Dopasuj holenderskie słowa i skróty z budowy do polskich znaczeń (czasem odwrotnie!).</p><p class="small">Seria 3 dobrych odpowiedzi zwiększa mnożnik punktów. Rekord: <b>${best()}</b></p><div class="row"><button class="btn acc full" id="go">Start!</button></div><p class="small">Dźwięk możesz wyciszyć ikoną głośnika w prawym górnym rogu.</p></div>`;
  $('#go').onclick=start}
